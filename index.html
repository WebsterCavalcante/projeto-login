<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <link rel="stylesheet" href="css/estilo.css"/>
    <link rel="stylesheet" href="css/media-query.css" />
    <title>Login</title>
</head>
<body>
    <main>
        <section id="login">
            <!--Areca de login-->
            <div id="imagem">
                <!--Foto-->
            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem-vindo(a). faça login para acessar sua conta.</p>
                <form action="login.php" method="post" autocomplete="on">
                    <div class="campo">
                        <!-- Login -->
                        <i class="material-icons">person</i>
                        <input type="email" name="login" id="ilogin" placeholder="Seu E-mail" autocomplete="email" required maxlength="30"/>
                        <label for="ilogin">Login</label>
                    </div>
                    <div class="campo">
                        <!-- Senha -->
                        <i class="material-icons">vpn_key</i>
                        <input type="password" name="Senha" id="isenha" autocomplete="current-password" required minlength="8" maxlength="20"/>
                        <label for="isenha">Senha</label>
                    </div>
                    <input type="submit" value="Entrar" />
                    <a href="esqueci.html" class="botao">
                        Esqueci a Senha <i class="material-icons">mail</i>
                    </a>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
